services:
  core-keeper:
    image: ghcr.io/danaketh/core-keeper-server:latest
    container_name: core-keeper-dedicated
    restart: unless-stopped
    stop_grace_period: 2m

    # Health check to monitor server status
    healthcheck:
      test: ["CMD", "pgrep", "-f", "CoreKeeperServer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Port is only needed if using direct connection mode
    # For SDR (Steam Datagram Relay) mode, leave these commented
    # ports:
    #   - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/udp"

    # Volume mapping for persistent data
    volumes:
      # Server data (world saves, configs)
      - ./server-data:/home/corekeeper/server/CoreKeeperServer_Data

    # Environment configuration
    environment:
      # World Configuration
      WORLD_INDEX: "${WORLD_INDEX:-0}"
      WORLD_NAME: "${WORLD_NAME:-Core Keeper Server}"
      WORLD_SEED: "${WORLD_SEED:-0}"
      WORLD_MODE: "${WORLD_MODE:-0}"
      # Server Configuration
      GAME_ID: "${GAME_ID:-}"
      HASHED_WORLD_SEED: "${HASHED_WORLD_SEED:-}"

    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G
